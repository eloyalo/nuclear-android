[package]
name = "player"
version = "1.20.0"
description = "Nuclear Music Player"
authors = ["nukeop <12746779+nukeop@users.noreply.github.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/nukeop/nuclear"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Applies to every platform's release build (Cargo profiles aren't
# per-target) — the Android .so is the main reason for these settings, but
# desktop release builds get smaller too, at the cost of longer compile
# times. panic="abort" was deliberately left out: Tauri's mobile runtime
# crosses the JNI boundary, and unwinding behavior there wasn't verified
# safe to change. See docs/apk-reducir-tamano-15-09-2026.md.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = "0.4"
tauri = { version = "2.7.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-upload = "2"
zip = "8.0"
reqwest = { version = "0.13", features = ["json", "cookies", "stream"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
base64 = "0.23"
http = "1.0"
percent-encoding = "2.3"
tempfile = "3.10"
tauri-plugin-opener = "2"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.20.0", features = ["v4"] }
libc = "0.2.183"
tauri-plugin-os = "2"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Desktop-only integrations: MCP server, local HTTP API, Discord rich presence.
rmcp = { version = "3.0", features = ["server", "transport-streamable-http-server"] }
schemars = "1.0"
async-stream = "0.3"
rust-embed = "8"
mime_guess = "2"
discord-rich-presence = "1.1.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# yt-dlp can't run on mobile; search and streams go through rustypipe instead.
# Pinned to a git rev: the 0.11.4 release panics fetching visitor data.
# See ANDROID_PLAYBACK.md §4.
rustypipe = { git = "https://codeberg.org/ThetaDev/rustypipe", rev = "c93bafd8", default-features = false, features = ["rustls-tls-webpki-roots"] }
# rquickjs ships no prebuilt bindings for Android targets, so they're generated
# at build time. Needs libclang and BINDGEN_EXTRA_CLANG_ARGS_<target> pointing
# at the NDK sysroot; see ANDROID_PLAYBACK.md §6.
rquickjs = { version = "0.9", features = ["bindgen"] }

[target.'cfg(target_os = "android")'.dependencies]
# reqwest's default certificate verifier needs a JVM Context on Android; we give
# it a rustls config with the webpki roots baked in instead. See src/tls.rs.
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs", "tls12", "logging"] }
webpki-roots = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4.1"

